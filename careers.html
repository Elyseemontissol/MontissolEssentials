<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Careers - Montissol Essentials</title>
  <meta name="description" content="Current openings at Montissol Essentials LLC. Explore janitorial, custodial, industrial cleaning, and facility-support roles and apply online.">
  <meta property="og:title" content="Careers - Montissol Essentials">
  <meta property="og:description" content="Current openings at Montissol Essentials LLC. Apply online.">
  <meta property="og:image" content="https://montissolessentials.com/assets/images/Header-logo.png">
  <meta property="og:url" content="https://montissolessentials.com/careers">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
  <style>
    /* Openings section — self-contained so the marketing hero above stays untouched. */
    .openings { padding: 8px 0 48px; }
    .openings__intro { color: var(--text-muted, #cfcfcf); max-width: 640px; margin: 0 0 24px; }
    .openings__list { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 720px) { .openings__list { grid-template-columns: 1fr 1fr; } }
    .job-card {
      display: block; padding: 24px 28px; border: 1px solid rgba(231,77,16,.28);
      border-radius: 14px; text-decoration: none; color: inherit;
      background: rgba(255,255,255,.02);
      transition: border-color .15s, transform .15s, background .15s;
    }
    .job-card:hover, .job-card:focus {
      border-color: #e74d10; background: rgba(231,77,16,.06); transform: translateY(-2px); outline: none;
    }
    .job-card__kicker { font-size: .78rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #e74d10; }
    .job-card__title { margin: 8px 0 4px; font-size: 1.5rem; line-height: 1.2; }
    .job-card__where { margin: 0 0 12px; color: #cfcfcf; font-weight: 600; }
    .job-card__snippet { margin: 0; color: #a8a8a8; line-height: 1.55; }
    .job-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; flex-wrap: wrap; gap: 12px; }
    .job-card__date { color: #888; font-size: .85rem; }
    .job-card__cta { color: #e74d10; font-weight: 700; }
    .openings__empty, .openings__loading, .openings__error {
      text-align: center; padding: 40px 24px;
      border: 1px dashed rgba(255,255,255,.15); border-radius: 14px;
    }
    .openings__empty h2, .openings__loading h2 { margin: 0 0 12px; }
    .openings__empty p, .openings__loading p, .openings__error p { margin: 0 0 16px; color: #b0b0b0; }
    .openings__error { border-color: rgba(229,72,77,.4); }

    /* Search bar */
    .openings__search { position: relative; margin: 0 0 24px; max-width: 480px; }
    .openings__search input {
      width: 100%; padding: 12px 16px 12px 44px;
      background: rgba(255,255,255,.03); color: inherit;
      border: 1px solid rgba(255,255,255,.15); border-radius: 10px;
      font: inherit; font-size: 1rem;
      transition: border-color .15s, background .15s;
    }
    .openings__search input:focus {
      outline: none; border-color: #e74d10; background: rgba(231,77,16,.06);
    }
    .openings__search input::placeholder { color: #888; }
    .openings__search::before {
      content: "🔍"; position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 1rem; opacity: .7;
    }
    /* Group headers */
    .openings__group { margin: 0 0 36px; }
    .openings__group:last-child { margin-bottom: 0; }
    .openings__group-title {
      display: flex; align-items: baseline; gap: 12px;
      margin: 0 0 16px; padding: 0 0 10px;
      border-bottom: 1px solid rgba(231,77,16,.28);
    }
    .openings__group-title h3 {
      margin: 0; font-size: 1.4rem; color: #fff; letter-spacing: .3px;
    }
    .openings__group-title .count {
      color: #e74d10; font-weight: 700; font-size: .95rem;
    }
    .openings__meta { color: #b0b0b0; font-size: .9rem; margin: 0 0 20px; }
  </style>
</head>
<body>

<div id="shared-header"></div>

<main>

  <!-- CAREERS HERO -->
  <section class="hero hero--services hero--zoom">
    <div class="hero-split__bg"
         style="background-image:url('assets/images/cement-plant-with-high-factory-structure-and-tower-N7J96QC.jpg');"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="hero-lightning"></div>
    <div class="hero-split__overlay"></div>
    <div class="container hero-split__inner">
      <div class="hero-split__kicker">
        <span class="dot"></span>
        <span>Montissol Essentials</span>
      </div>
      <h1 class="hero-split__headline">Careers</h1>
      <p class="hero-split__sub">
        Join a growing team supporting federal facilities, industrial sites, and community landmarks across the country.
      </p>
      <div class="hero-split__actions">
        <a class="btn primary" href="#open-positions">View Open Positions</a>
      </div>
    </div>
  </section>

  <!-- OPEN POSITIONS -->
  <section class="section reveal" id="open-positions">
    <div class="container">
      <div class="card reveal glow-border" style="grid-column: span 12; padding:28px;">
        <div class="mini-kicker">
          <span class="dot"></span>
          <span>Careers</span>
        </div>
        <h2>Open Positions</h2>
        <div class="hr"></div>
        <p class="openings__intro">
          Every posting below is live. Click a role for the full description and to apply online — no account required.
        </p>
        <div class="openings">
          <label for="openings-search" class="openings__search">
            <input id="openings-search" type="search" placeholder="Search by role, city, state, or keyword…" autocomplete="off" aria-label="Search open positions">
          </label>
          <p id="openings-meta" class="openings__meta"></p>
          <div id="openings-list"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="shared-footer"></div>

<script src="assets/shared.js"></script>
<script src="assets/app.js"></script>

<script>
(function () {
  var mount = document.getElementById('openings-list');
  var meta = document.getElementById('openings-meta');
  var searchInput = document.getElementById('openings-search');
  if (!mount) return;

  var STATE_NAMES = {
    AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California',
    CO:'Colorado', CT:'Connecticut', DE:'Delaware', FL:'Florida', GA:'Georgia',
    HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa',
    KS:'Kansas', KY:'Kentucky', LA:'Louisiana', ME:'Maine', MD:'Maryland',
    MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri',
    MT:'Montana', NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey',
    NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota', OH:'Ohio',
    OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina',
    SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont',
    VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming',
    DC:'District of Columbia', PR:'Puerto Rico'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }
  function relPosted(iso) {
    if (!iso) return '';
    var days = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 86400000));
    if (days === 0) return 'Posted today';
    if (days === 1) return 'Posted 1 day ago';
    return 'Posted ' + days + ' days ago';
  }
  function stateLabel(raw) {
    var s = String(raw || '').trim();
    if (!s) return 'Other locations';
    var up = s.toUpperCase();
    if (STATE_NAMES[up]) return STATE_NAMES[up];
    return s;
  }
  function renderCard(item) {
    var subhead = item.subheadline || ((item.city || '') + (item.state ? ', ' + item.state : ''));
    var snip = String(item.paragraph1 || '').slice(0, 240);
    if (item.paragraph1 && item.paragraph1.length > 240) snip += '…';
    return '<a class="job-card" href="/job-' + esc(item.slug) + '">'
      +   '<div class="job-card__kicker">' + esc(item.kicker || 'Now Hiring') + '</div>'
      +   '<h2 class="job-card__title">' + esc(item.headline || 'Open Position') + '</h2>'
      +   '<p class="job-card__where">' + esc(subhead) + '</p>'
      +   '<p class="job-card__snippet">' + esc(snip) + '</p>'
      +   '<div class="job-card__foot">'
      +     '<span class="job-card__date">' + esc(relPosted(item.postedAt)) + '</span>'
      +     '<span class="job-card__cta">View position &amp; apply →</span>'
      +   '</div>'
      + '</a>';
  }
  function matches(item, q) {
    if (!q) return true;
    var haystack = [
      item.headline, item.kicker, item.subheadline,
      item.city, item.state, stateLabel(item.state),
      item.projectName, item.paragraph1, item.paragraph2, item.h2, item.slug,
    ].join(' ').toLowerCase();
    return q.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
  }
  function groupByState(items) {
    var groups = {};
    items.forEach(function (item) {
      var label = stateLabel(item.state);
      (groups[label] = groups[label] || []).push(item);
    });
    return Object.keys(groups).sort(function (a, b) {
      // Push "Other locations" to the bottom, everything else alphabetical.
      if (a === 'Other locations') return 1;
      if (b === 'Other locations') return -1;
      return a.localeCompare(b);
    }).map(function (label) {
      return { label: label, items: groups[label] };
    });
  }
  function render(items, q) {
    var filtered = items.filter(function (it) { return matches(it, q); });
    if (!filtered.length) {
      meta.textContent = q ? 'No positions match “' + q + '”.' : '';
      mount.innerHTML = q
        ? '<div class="openings__empty"><h2>No matches</h2><p>Try a different keyword, or clear the search to see everything.</p></div>'
        : '<div class="openings__empty">'
          + '<h2>No open positions at this time</h2>'
          + '<p>We aren\'t actively recruiting for a specific role right now. New opportunities are posted here as we win projects — please check back soon.</p>'
          + '<p><a class="btn primary" href="/contact-us">Contact us to introduce yourself</a></p>'
          + '</div>';
      return;
    }
    var groups = groupByState(filtered);
    var stateCount = groups.length;
    meta.textContent = filtered.length + ' open position' + (filtered.length === 1 ? '' : 's') +
      ' across ' + stateCount + ' state' + (stateCount === 1 ? '' : 's') +
      (q ? ' matching “' + q + '”' : '') + '.';
    mount.innerHTML = groups.map(function (g) {
      return '<section class="openings__group">'
        +   '<div class="openings__group-title">'
        +     '<h3>' + esc(g.label) + '</h3>'
        +     '<span class="count">' + g.items.length + ' opening' + (g.items.length === 1 ? '' : 's') + '</span>'
        +   '</div>'
        +   '<div class="openings__list">'
        +     g.items.map(renderCard).join('')
        +   '</div>'
        + '</section>';
    }).join('');
  }

  var allItems = [];
  mount.innerHTML = '<div class="openings__loading"><h2>Loading current openings…</h2><p>One moment while we pull the latest roles.</p></div>';

  fetch('/api/jobs?directory=1&format=json', { headers: { 'Accept': 'application/json' } })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (json) {
      allItems = (json && json.items) || [];
      render(allItems, '');
      searchInput.addEventListener('input', function () {
        render(allItems, searchInput.value.trim().toLowerCase());
      });
    })
    .catch(function (err) {
      console.error('Could not load openings:', err);
      meta.textContent = '';
      mount.innerHTML = '<div class="openings__error">'
        + '<h2>Could not load current openings</h2>'
        + '<p>Please refresh the page in a moment, or <a href="/contact-us" style="color:#e74d10;">contact us directly</a>.</p>'
        + '</div>';
    });
})();
</script>
</body>
</html>
