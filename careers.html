<!doctype html>
<html lang="en">
<head>
  <script>try{try{localStorage.removeItem("me-theme")}catch(e){}var t=localStorage.getItem("me-theme-v2")||"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Careers - Montissol Essentials</title>
  <meta name="description" content="Current openings at Montissol Essentials LLC. Explore janitorial, custodial, industrial cleaning, and facility-support roles and apply online.">
  <meta property="og:title" content="Careers - Montissol Essentials">
  <meta property="og:description" content="Current openings at Montissol Essentials LLC. Apply online.">
  <meta property="og:image" content="https://montissolessentials.com/assets/images/Header-logo.png">
  <meta property="og:url" content="https://montissolessentials.com/careers">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
  <style>
    /* Openings section — uses the site's theme tokens so it adapts to light/dark. */
    .openings { padding: 8px 0 48px; }
    .openings__intro { color: var(--text-secondary); max-width: 640px; margin: 0 0 24px; }
    .openings__list { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 720px) { .openings__list { grid-template-columns: 1fr 1fr; } }
    .job-card {
      display: block; padding: 24px 28px; border: 1px solid rgba(231,77,16,.28);
      border-radius: 14px; text-decoration: none; color: inherit;
      background: var(--card);
      transition: border-color .15s, transform .15s, background .15s, box-shadow .15s;
    }
    .job-card:hover, .job-card:focus {
      border-color: #e74d10; background: rgba(231,77,16,.06); transform: translateY(-2px); outline: none;
      box-shadow: 0 6px 18px rgba(20,24,28,.08);
    }
    :root[data-theme="dark"] .job-card:hover,
    :root[data-theme="dark"] .job-card:focus { box-shadow: none; }
    .job-card__kicker { font-size: .78rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #e74d10; }
    .job-card__title { margin: 8px 0 4px; font-size: 1.5rem; line-height: 1.2; color: var(--text); }
    .job-card__where { margin: 0 0 12px; color: var(--text); font-weight: 600; }
    .job-card__snippet { margin: 0; color: var(--text-secondary); line-height: 1.55; }
    .job-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; flex-wrap: wrap; gap: 12px; }
    .job-card__date { color: var(--text-muted); font-size: .85rem; }
    .job-card__cta { color: #e74d10; font-weight: 700; }
    .openings__empty, .openings__loading, .openings__error {
      text-align: center; padding: 40px 24px;
      border: 1px dashed var(--border); border-radius: 14px;
    }
    .openings__empty h2, .openings__loading h2 { margin: 0 0 12px; color: var(--text); }
    .openings__empty p, .openings__loading p, .openings__error p { margin: 0 0 16px; color: var(--text-secondary); }
    .openings__error { border-color: rgba(229,72,77,.4); }

    /* Filter bar — search + dropdowns on one row (wraps on narrow screens) */
    .openings__filters {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin: 0 0 20px; align-items: stretch;
    }
    .openings__search { position: relative; flex: 1 1 260px; min-width: 240px; }
    .openings__search input {
      width: 100%; height: 44px; padding: 0 16px 0 40px;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font: inherit; font-size: 1rem;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .openings__search input:focus {
      outline: none; border-color: #e74d10; box-shadow: 0 0 0 3px rgba(231,77,16,.15);
    }
    .openings__search input::placeholder { color: var(--text-muted); }
    .openings__search::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: .95rem; opacity: .7; pointer-events: none;
    }
    .openings__select {
      height: 44px; padding: 0 36px 0 14px;
      background: var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 12px center;
      color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font: inherit; font-size: .95rem;
      cursor: pointer; appearance: none; -webkit-appearance: none;
      transition: border-color .15s, box-shadow .15s;
      min-width: 150px;
    }
    .openings__select:focus {
      outline: none; border-color: #e74d10; box-shadow: 0 0 0 3px rgba(231,77,16,.15);
    }
    .openings__meta { color: var(--text-secondary); font-size: .9rem; margin: 0 0 20px; }
  </style>
</head>
<body>

<div id="shared-header"></div>

<main>

  <!-- CAREERS HERO -->
  <section class="hero hero--services hero--zoom">
    <div class="hero-split__bg"
         style="background-image:url('assets/images/cement-plant-with-high-factory-structure-and-tower-N7J96QC.jpg');"></div>
    <canvas id="particleCanvas"></canvas>
    <div class="hero-lightning"></div>
    <div class="hero-split__overlay"></div>
    <div class="container hero-split__inner">
      <h1 class="hero-split__headline">Careers</h1>
      <p class="hero-split__sub">
        Join a growing team supporting federal facilities, industrial sites, and community landmarks across the country.
      </p>
      <div class="hero-split__actions">
        <a class="btn primary" href="#open-positions">View Open Positions</a>
      </div>
    </div>
  </section>

  <!-- OPEN POSITIONS -->
  <section class="section reveal" id="open-positions">
    <div class="container">
      <div class="card reveal glow-border" style="grid-column: span 12; padding:28px;">
        <h2>Open Positions</h2>
        <div class="hr"></div>
        <p class="openings__intro">
          Every posting below is live. Click a role for the full description and to apply online — no account required.
        </p>
        <div class="openings">
          <div class="openings__filters">
            <label for="openings-search" class="openings__search">
              <input id="openings-search" type="search" placeholder="Search by role, city, keyword…" autocomplete="off" aria-label="Search open positions">
            </label>
            <select id="openings-state" class="openings__select" aria-label="Filter by state">
              <option value="">All states</option>
            </select>
            <select id="openings-role" class="openings__select" aria-label="Filter by role">
              <option value="">All roles</option>
            </select>
            <select id="openings-sort" class="openings__select" aria-label="Sort order">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="az">Role A–Z</option>
              <option value="state">By state</option>
            </select>
          </div>
          <p id="openings-meta" class="openings__meta"></p>
          <div id="openings-list"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="shared-footer"></div>

<script src="assets/shared.js"></script>
<script src="assets/app.js"></script>

<script>
(function () {
  var mount = document.getElementById('openings-list');
  var meta = document.getElementById('openings-meta');
  var searchInput = document.getElementById('openings-search');
  var stateSel = document.getElementById('openings-state');
  var roleSel = document.getElementById('openings-role');
  var sortSel = document.getElementById('openings-sort');
  if (!mount) return;

  var STATE_NAMES = {
    AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California',
    CO:'Colorado', CT:'Connecticut', DE:'Delaware', FL:'Florida', GA:'Georgia',
    HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa',
    KS:'Kansas', KY:'Kentucky', LA:'Louisiana', ME:'Maine', MD:'Maryland',
    MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri',
    MT:'Montana', NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey',
    NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota', OH:'Ohio',
    OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina',
    SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont',
    VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming',
    DC:'District of Columbia', PR:'Puerto Rico'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }
  function relPosted(iso) {
    if (!iso) return '';
    var days = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 86400000));
    if (days === 0) return 'Posted today';
    if (days === 1) return 'Posted 1 day ago';
    return 'Posted ' + days + ' days ago';
  }
  function stateLabel(raw) {
    var s = String(raw || '').trim();
    if (!s) return 'Other';
    var up = s.toUpperCase();
    if (STATE_NAMES[up]) return STATE_NAMES[up];
    return s;
  }
  function roleKey(item) {
    // The headline is the human-facing role name (e.g. "Janitorial Services").
    return String(item.headline || item.kicker || '').trim();
  }
  function renderCard(item) {
    var subhead = item.subheadline || ((item.city || '') + (item.state ? ', ' + item.state : ''));
    var snip = String(item.paragraph1 || '').slice(0, 240);
    if (item.paragraph1 && item.paragraph1.length > 240) snip += '…';
    return '<a class="job-card" href="/job-' + esc(item.slug) + '">'
      +   '<div class="job-card__kicker">' + esc(item.kicker || 'Now Hiring') + '</div>'
      +   '<h2 class="job-card__title">' + esc(item.headline || 'Open Position') + '</h2>'
      +   '<p class="job-card__where">' + esc(subhead) + '</p>'
      +   '<p class="job-card__snippet">' + esc(snip) + '</p>'
      +   '<div class="job-card__foot">'
      +     '<span class="job-card__date">' + esc(relPosted(item.postedAt)) + '</span>'
      +     '<span class="job-card__cta">View position &amp; apply →</span>'
      +   '</div>'
      + '</a>';
  }
  function matchesKeyword(item, q) {
    if (!q) return true;
    var haystack = [
      item.headline, item.kicker, item.subheadline,
      item.city, item.state, stateLabel(item.state),
      item.projectName, item.paragraph1, item.paragraph2, item.h2, item.slug,
    ].join(' ').toLowerCase();
    return q.split(/\s+/).every(function (word) { return haystack.indexOf(word) !== -1; });
  }
  function sortItems(items, mode) {
    var copy = items.slice();
    if (mode === 'oldest') {
      copy.sort(function (a, b) { return (Date.parse(a.postedAt) || 0) - (Date.parse(b.postedAt) || 0); });
    } else if (mode === 'az') {
      copy.sort(function (a, b) { return roleKey(a).localeCompare(roleKey(b)); });
    } else if (mode === 'state') {
      copy.sort(function (a, b) {
        var sa = stateLabel(a.state), sb = stateLabel(b.state);
        if (sa === 'Other' && sb !== 'Other') return 1;
        if (sb === 'Other' && sa !== 'Other') return -1;
        return sa.localeCompare(sb);
      });
    } else {
      // newest first (default)
      copy.sort(function (a, b) { return (Date.parse(b.postedAt) || 0) - (Date.parse(a.postedAt) || 0); });
    }
    return copy;
  }
  function populateFilters(items) {
    // State dropdown — unique full state names from the data.
    var stateMap = {};
    items.forEach(function (it) {
      var raw = (it.state || '').trim();
      if (!raw) return;
      var label = stateLabel(raw);
      stateMap[label] = raw; // preserve the raw value for filter matching
    });
    var stateLabels = Object.keys(stateMap).sort();
    stateLabels.forEach(function (label) {
      var opt = document.createElement('option');
      opt.value = stateMap[label];
      opt.textContent = label;
      stateSel.appendChild(opt);
    });

    // Role dropdown — unique headlines from the data.
    var roleSet = {};
    items.forEach(function (it) {
      var r = roleKey(it);
      if (r) roleSet[r] = true;
    });
    Object.keys(roleSet).sort().forEach(function (role) {
      var opt = document.createElement('option');
      opt.value = role;
      opt.textContent = role;
      roleSel.appendChild(opt);
    });
  }
  function render() {
    var q = searchInput.value.trim().toLowerCase();
    var stateFilter = stateSel.value;
    var roleFilter = roleSel.value;
    var sortMode = sortSel.value;

    var filtered = allItems.filter(function (it) {
      if (!matchesKeyword(it, q)) return false;
      if (stateFilter && (it.state || '').trim().toUpperCase() !== stateFilter.toUpperCase()) return false;
      if (roleFilter && roleKey(it) !== roleFilter) return false;
      return true;
    });
    var ordered = sortItems(filtered, sortMode);

    if (!ordered.length) {
      meta.textContent = '';
      var anyFilterActive = q || stateFilter || roleFilter;
      mount.innerHTML = anyFilterActive
        ? '<div class="openings__empty"><h2>No matches</h2><p>Try different filters, or clear them to see every opening.</p></div>'
        : '<div class="openings__empty">'
          + '<h2>No open positions at this time</h2>'
          + '<p>We aren\'t actively recruiting for a specific role right now. New opportunities are posted here as we win projects — please check back soon.</p>'
          + '<p><a class="btn primary" href="/contact-us">Contact us to introduce yourself</a></p>'
          + '</div>';
      return;
    }
    meta.textContent = ordered.length + ' open position' + (ordered.length === 1 ? '' : 's')
      + (allItems.length !== ordered.length ? ' (of ' + allItems.length + ' total)' : '') + '.';
    mount.innerHTML = '<div class="openings__list">' + ordered.map(renderCard).join('') + '</div>';
  }

  var allItems = [];
  mount.innerHTML = '<div class="openings__loading"><h2>Loading current openings…</h2><p>One moment while we pull the latest roles.</p></div>';

  fetch('/api/jobs?directory=1&format=json', { headers: { 'Accept': 'application/json' } })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (json) {
      allItems = (json && json.items) || [];
      populateFilters(allItems);
      render();
      searchInput.addEventListener('input', render);
      stateSel.addEventListener('change', render);
      roleSel.addEventListener('change', render);
      sortSel.addEventListener('change', render);
    })
    .catch(function (err) {
      console.error('Could not load openings:', err);
      meta.textContent = '';
      mount.innerHTML = '<div class="openings__error">'
        + '<h2>Could not load current openings</h2>'
        + '<p>Please refresh the page in a moment, or <a href="/contact-us" style="color:#e74d10;">contact us directly</a>.</p>'
        + '</div>';
    });
})();
</script>
</body>
</html>
