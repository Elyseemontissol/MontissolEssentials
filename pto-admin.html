<!doctype html>
<html lang="en">
<head>
  <script>try{var t=localStorage.getItem("me-theme")||"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTO Admin — Montissol Essentials</title>
  <meta name="robots" content="noindex">
  <style>
    :root{
      --bg:#0a0a0a; --card:#141414; --text:#f1f1f1; --text-muted:#888;
      --border:#2a2a2a; --brand:#e74d10; --radius:10px;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",sans-serif;line-height:1.5;}
    main{max-width:960px;margin:32px auto;padding:24px;}
    h1{margin:0 0 16px 0;}
    h2{margin:24px 0 12px 0;font-size:1.15rem;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
    label{display:block;font-size:.85rem;color:var(--text-muted);margin-bottom:6px;}
    input,textarea,select{width:100%;padding:9px 12px;background:#0a0a0a;color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:.92rem;}
    button{padding:9px 16px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;}
    button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
    button.green{background:#16a34a;}
    button.red{background:#dc2626;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .row{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:10px;}
    .err{color:#f87171;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:none;}
    table{width:100%;border-collapse:collapse;}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:.9rem;}
    th{color:var(--text-muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;}
    .muted{color:var(--text-muted);}
    .hidden{display:none;}
    .actions{display:flex;gap:6px;flex-wrap:wrap;}
    .project-head{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;padding:6px 8px;margin:0 -8px;border-radius:6px;font-size:.88rem;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase;transition:background .15s ease;}
    .project-head:hover{background:rgba(231,77,16,.08);}
    .project-head .chev{display:inline-block;width:12px;height:12px;transition:transform .2s ease;flex-shrink:0;}
    .project-group.collapsed .chev{transform:rotate(-90deg);}
    .project-group.collapsed table{display:none;}
    .project-head .count{color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0;margin-left:4px;}
    .proj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(231,77,16,.08);border:1px solid rgba(231,77,16,.35);border-radius:999px;font-size:.82rem;color:var(--text);}
    .proj-chip .del{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:0 2px;font-size:1rem;line-height:1;}
    .proj-chip .del:hover{color:#f87171;}
  </style>
</head>
<body>
<main>

  <!-- Login -->
  <section id="loginView" class="card">
    <h1>PTO Admin</h1>
    <div id="loginErr" class="err"></div>
    <div style="margin-bottom:12px;">
      <label for="pwd">Admin password</label>
      <input id="pwd" type="password" autocomplete="current-password">
    </div>
    <button id="loginBtn" type="button">Sign In</button>
  </section>

  <!-- App -->
  <section id="appView" class="hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
      <h1 style="margin:0;">PTO Admin</h1>
      <div style="display:flex;gap:8px;">
        <a href="/" class="ghost-link" style="padding:8px 14px;border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:.85rem;">← Home</a>
        <button id="signOutBtn" class="ghost" type="button" style="padding:8px 14px;">Sign out</button>
      </div>
    </div>

    <div class="card">
      <h2>Pending requests (<span id="pendingCount">0</span>)</h2>
      <div id="pendingList"></div>
    </div>

    <div class="card">
      <h2>Projects (<span id="projCount">0</span>)</h2>
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
        <input id="newProject" placeholder="New project name (e.g. NOAA Virginia Key)" style="flex:1;min-width:220px;">
        <button id="addProjBtn">Add Project</button>
      </div>
      <div id="projErr" class="err"></div>
      <div id="projList" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>

    <div class="card">
      <h2>Employees (<span id="empCount">0</span>) <button id="showAddBtn" class="ghost" style="float:right;">+ Add Employee</button></h2>
      <div id="addEmpForm" class="hidden" style="margin-bottom:16px;padding:14px;border:1px solid var(--border);border-radius:8px;">
        <div class="row">
          <div><label>Full name</label><input id="addName"></div>
          <div><label>Email</label><input id="addEmail" type="email"></div>
          <div><label>Last 4 SSN</label><input id="addSsn" maxlength="4" pattern="\d{4}" inputmode="numeric"></div>
        </div>
        <div class="row" style="grid-template-columns:1fr;">
          <div>
            <label>Project</label>
            <select id="addProject">
              <option value="">Unassigned</option>
            </select>
            <div style="font-size:.78rem;color:var(--text-muted);margin-top:4px;">
              Need a new project? Add it in the Projects card above first.
            </div>
          </div>
        </div>
        <div id="addErr" class="err"></div>
        <button id="addEmpBtn">Add Employee</button>
        <button id="cancelAddBtn" class="ghost">Cancel</button>
      </div>
      <div id="projectGroups"></div>
    </div>

    <div class="card">
      <h2>Decided (last 50)</h2>
      <div id="decidedList"></div>
    </div>
  </section>

</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  let password = null;

  function escape(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
  }

  async function api(path, opts = {}) {
    opts.headers = { ...(opts.headers || {}), 'Authorization': 'Bearer ' + password };
    if (opts.body && typeof opts.body !== 'string') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(path, opts);
    return { status: res.status, data: await res.json().catch(() => ({})) };
  }

  async function attemptLogin(pwd) {
    password = pwd;
    const { status } = await api('/api/pto?resource=employees', { method: 'GET' });
    if (status === 401) {
      password = null;
      return false;
    }
    sessionStorage.setItem('me_admin_token', pwd);
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    await reloadAll();
    return true;
  }

  $('loginBtn').addEventListener('click', async () => {
    const pwd = $('pwd').value;
    if (!pwd) return;
    const ok = await attemptLogin(pwd);
    if (!ok) {
      $('loginErr').textContent = 'Wrong password.';
      $('loginErr').style.display = 'block';
    }
  });

  // Auto-login if a saved admin token is in this tab's session (set by either
  // the homepage admin modal or the invoice.html admin modal).
  (async function autoLogin() {
    const saved = sessionStorage.getItem('me_admin_token');
    if (!saved) return;
    const ok = await attemptLogin(saved);
    if (!ok) sessionStorage.removeItem('me_admin_token');
  })();

  let currentProjects = []; // mirror of server-side project list

  async function reloadAll() {
    await Promise.all([reloadProjects(), reloadEmployees(), reloadRequests()]);
  }

  async function reloadProjects() {
    const { data } = await api('/api/pto?resource=projects', { method: 'GET' });
    currentProjects = (data.projects || []).slice();
    $('projCount').textContent = currentProjects.length;
    $('projList').innerHTML = currentProjects.length
      ? currentProjects.map((p) => `
          <span class="proj-chip">
            <span>${escape(p)}</span>
            <button class="del" data-proj="${escape(p)}" title="Delete project" aria-label="Delete project ${escape(p)}">×</button>
          </span>
        `).join('')
      : '<div class="muted">No projects yet. Add one above.</div>';
    // Populate the Add Employee project select.
    $('addProject').innerHTML = '<option value="">Unassigned</option>'
      + currentProjects.map((p) => `<option value="${escape(p)}">${escape(p)}</option>`).join('');
    // Wire delete handlers.
    $('projList').querySelectorAll('.del').forEach((btn) => {
      btn.addEventListener('click', () => handleDeleteProject(btn.dataset.proj));
    });
  }

  async function handleDeleteProject(name) {
    if (!confirm(`Delete project "${name}"?\n\nThis is blocked if any employee is still assigned to it.`)) return;
    const { data } = await api('/api/pto?resource=projects&name=' + encodeURIComponent(name), { method: 'DELETE' });
    if (!data.ok) {
      alert(data.error || 'Failed to delete project.');
      return;
    }
    await reloadAll();
  }

  $('addProjBtn').addEventListener('click', async () => {
    const name = $('newProject').value.trim();
    hideErr($('projErr'));
    if (!name) return;
    const { data } = await api('/api/pto?resource=projects', { method: 'POST', body: { name } });
    if (!data.ok) {
      $('projErr').textContent = data.error || 'Failed to add project.';
      $('projErr').style.display = 'block';
      return;
    }
    $('newProject').value = '';
    await reloadProjects();
  });
  $('newProject').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); $('addProjBtn').click(); }
  });
  function hideErr(el) { el.style.display = 'none'; }

  async function reloadEmployees() {
    const { data } = await api('/api/pto?resource=employees', { method: 'GET' });
    const employees = data.employees || [];
    $('empCount').textContent = employees.length;

    // Group employees by project; always put "Unassigned" at the bottom.
    const groups = {};
    employees.forEach(e => {
      const p = (e.project && String(e.project).trim()) || 'Unassigned';
      if (!groups[p]) groups[p] = [];
      groups[p].push(e);
    });
    const names = Object.keys(groups).sort((a, b) => {
      if (a === 'Unassigned') return 1;
      if (b === 'Unassigned') return -1;
      return a.localeCompare(b);
    });

    if (!employees.length) {
      $('projectGroups').innerHTML = '<div class="muted" style="margin-top:12px;">No employees yet.</div>';
      return;
    }

    $('projectGroups').innerHTML = names.map(p => `
      <div class="project-group collapsed" data-project="${escape(p)}" style="margin-top:20px;">
        <h3 class="project-head" role="button" tabindex="0" aria-expanded="false">
          <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
          <span>${escape(p)}</span>
          <span class="count">— ${groups[p].length} ${groups[p].length === 1 ? 'person' : 'people'}</span>
        </h3>
        <table><thead>
          <tr><th>Name</th><th>Email</th><th>Balance</th><th>Project</th><th></th></tr>
        </thead><tbody>
          ${groups[p].map(e => `
            <tr data-id="${e.id}">
              <td>${escape(e.name)}</td>
              <td>${escape(e.email)}</td>
              <td>${e.balanceDays} d</td>
              <td>${escape(e.project || 'Unassigned')}</td>
              <td class="actions">
                <button class="ghost" data-act="adjust">Balance</button>
                <button class="ghost" data-act="project">Project</button>
                <button class="ghost" data-act="ssn">Reset SSN</button>
                <button class="ghost" data-act="del">🗑</button>
              </td>
            </tr>
          `).join('')}
        </tbody></table>
      </div>
    `).join('');

    // Row action buttons
    $('projectGroups').querySelectorAll('tbody button').forEach(btn => {
      btn.addEventListener('click', () => handleEmpAction(btn));
    });

    // Collapsible project headers — click or Enter/Space on the header toggles.
    $('projectGroups').querySelectorAll('.project-head').forEach(head => {
      const toggle = () => {
        const group = head.closest('.project-group');
        const collapsed = group.classList.toggle('collapsed');
        head.setAttribute('aria-expanded', String(!collapsed));
      };
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
    });
  }

  async function handleEmpAction(btn) {
    const id = btn.closest('tr').dataset.id;
    const act = btn.dataset.act;
    if (act === 'del') {
      if (!confirm('Delete this employee? Their request history is preserved.')) return;
      await api('/api/pto?resource=employees&id=' + encodeURIComponent(id), { method: 'DELETE' });
      reloadEmployees();
    } else if (act === 'adjust') {
      const v = prompt('Set new PTO balance (days):');
      if (v === null) return;
      const n = Number(v);
      if (!Number.isFinite(n) || n < 0) return alert('Must be a non-negative number.');
      await api('/api/pto?resource=employees&id=' + encodeURIComponent(id), { method: 'PATCH', body: { balanceDays: n } });
      reloadEmployees();
    } else if (act === 'project') {
      const current = btn.closest('tr').querySelector('td:nth-child(4)').textContent.trim();
      const options = currentProjects.length
        ? `\n\nAvailable projects:\n  ${currentProjects.join('\n  ')}\n\nType the exact name (case-sensitive), or leave blank for Unassigned.\nAdd new projects in the Projects card.`
        : '\n\n(No projects defined yet — add one in the Projects card first, or leave blank.)';
      const v = prompt('Reassign project:' + options, current === 'Unassigned' ? '' : current);
      if (v === null) return;
      const trimmed = v.trim();
      if (trimmed && !currentProjects.includes(trimmed)) {
        if (!confirm(`"${trimmed}" is not in the project list. Assign anyway and add it as a new project?`)) return;
      }
      await api('/api/pto?resource=employees&id=' + encodeURIComponent(id), { method: 'PATCH', body: { project: trimmed } });
      await reloadAll();
    } else if (act === 'ssn') {
      const v = prompt('New last 4 of SSN:');
      if (v === null) return;
      if (!/^\d{4}$/.test(v)) return alert('Must be exactly 4 digits.');
      await api('/api/pto?resource=employees&id=' + encodeURIComponent(id), { method: 'PATCH', body: { ssn4: v } });
      alert('SSN updated.');
    }
  }

  async function reloadRequests() {
    // Fetch employees alongside so the pending list can preview paid/unpaid
    // split against the current balance before approval.
    const [pendingRes, empRes] = await Promise.all([
      api('/api/pto?resource=requests&status=pending', { method: 'GET' }),
      api('/api/pto?resource=employees', { method: 'GET' }),
    ]);
    const pending = pendingRes.data.requests || [];
    const empsById = new Map((empRes.data.employees || []).map(e => [e.id, e]));
    $('pendingCount').textContent = pending.length;
    $('pendingList').innerHTML = pending.map(r => {
      const emp = empsById.get(r.employeeId);
      const bal = emp ? emp.balanceDays : 0;
      const paid = Math.min(r.days, bal);
      const unpaid = r.days - paid;
      const preview = unpaid > 0
        ? `<span style="color:#fbbf24;font-size:.82rem;"> — would be ${paid} paid + ${unpaid} unpaid</span>`
        : '';
      return `
        <div style="padding:12px 0;border-bottom:1px solid var(--border);">
          <div><strong>${escape(r.employeeName)}</strong> · ${fmtDate(r.startDate)} – ${fmtDate(r.endDate)} (${r.days} d)${preview}</div>
          <div class="muted">${escape(r.reason)}</div>
          <div class="actions" style="margin-top:8px;">
            <button class="green" data-req="${r.id}" data-act="approve">✅ Approve</button>
            <button class="red" data-req="${r.id}" data-act="deny">❌ Deny</button>
          </div>
        </div>
      `;
    }).join('') || '<div class="muted">No pending requests.</div>';
    $('pendingList').querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => handleDecide(btn));
    });

    const { data: allRes } = await api('/api/pto?resource=requests', { method: 'GET' });
    const decided = (allRes.requests || []).filter(r => r.status !== 'pending');
    $('decidedList').innerHTML = decided.map(r => {
      const split = (r.status === 'approved' && Number.isFinite(r.unpaidDays) && r.unpaidDays > 0)
        ? ` <span class="muted" style="font-size:.78rem;">(${r.paidDays} paid + ${r.unpaidDays} unpaid)</span>`
        : '';
      return `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem;">
          <strong>${escape(r.employeeName)}</strong> · ${fmtDate(r.startDate)} – ${fmtDate(r.endDate)} (${r.days} d)${split} ·
          <span style="color:${r.status === 'approved' ? '#22c55e' : '#f87171'};">${r.status}</span>
          ${r.decisionNote ? ` · <span class="muted">"${escape(r.decisionNote)}"</span>` : ''}
        </div>
      `;
    }).join('') || '<div class="muted">No decided requests.</div>';
  }

  async function handleDecide(btn) {
    const id = btn.dataset.req;
    const decision = btn.dataset.act;
    let note = null;
    if (decision === 'deny') {
      note = prompt('Optional reason (visible to the employee):') || null;
    }
    btn.disabled = true;
    const { status, data } = await api('/api/pto?resource=decide&id=' + encodeURIComponent(id), { method: 'POST', body: { decision, note } });
    if (!data.ok) alert('Failed: ' + (data.error || status));
    reloadAll();
  }

  $('showAddBtn').addEventListener('click', () => { $('addEmpForm').classList.toggle('hidden'); });
  $('cancelAddBtn').addEventListener('click', () => { $('addEmpForm').classList.add('hidden'); });

  $('addEmpBtn').addEventListener('click', async () => {
    $('addErr').style.display = 'none';
    const name = $('addName').value.trim();
    const email = $('addEmail').value.trim();
    const ssn4 = $('addSsn').value.trim();
    const project = $('addProject').value.trim();
    if (!name || !email || !/^\d{4}$/.test(ssn4)) {
      $('addErr').textContent = 'Name, email, and 4-digit SSN are required.';
      $('addErr').style.display = 'block';
      return;
    }
    const { data } = await api('/api/pto?resource=employees', { method: 'POST', body: { name, email, ssn4, project } });
    if (!data.ok) {
      $('addErr').textContent = data.error || 'Failed to add.';
      $('addErr').style.display = 'block';
      return;
    }
    $('addName').value = ''; $('addEmail').value = ''; $('addSsn').value = ''; $('addProject').value = '';
    $('addEmpForm').classList.add('hidden');
    reloadEmployees();
  });

  $('signOutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('me_admin_token');
    window.location.href = '/';
  });
</script>
</body>
</html>
